<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radio Guest Flyer Generator</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1b2233;--mute:#5b6478;--line:#d6dbe8;--brand:#00409c;--red:#f5173c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#192032;--ink:#eef1f8;--mute:#9aa4bd;--line:#2c3650;--brand:#5b8def}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:22px 20px 6px;max-width:1100px;margin:auto}
h1{margin:0;font-size:1.5rem}header p{margin:4px 0 0;color:var(--mute)}
main{max-width:1100px;margin:auto;padding:14px 20px 40px;display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px;align-items:start}
@media(max-width:800px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-weight:600;font-size:.85rem;margin:14px 0 6px}label:first-child{margin-top:0}
input[type=text],input[type=date]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font-size:1rem}
input[type=file]{width:100%;font-size:.9rem;color:var(--mute)}
input[type=range]{width:100%}
.row{display:flex;gap:10px}.row>div{flex:1}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--red);color:#fff;font-size:1rem;font-weight:700;cursor:pointer}
button.alt{background:transparent;color:var(--brand);border:1px solid var(--brand);margin-top:8px}
.stage{display:flex;flex-direction:column;align-items:center;gap:8px}
canvas{width:100%;max-width:640px;height:auto;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.hint{color:var(--mute);font-size:.8rem;text-align:center}
</style></head>
<body>
<header><h1>Radio Guest Flyer Generator</h1><p>Fill in the details and the flyer updates live.</p></header>
<main>
<section class="panel">
<label for="name">Name</label><input id="name" type="text" value="Michael Boateng - Oxygen">
<label for="role">Title / position</label><input id="role" type="text" value="WN NPP Communication Team Member">
<label for="fm">FM station name</label><input id="fm" type="text" value="Stylish FM">
<label for="date">Date</label><input id="date" type="date" value="2026-11-23">
<label for="photo">New picture</label><input id="photo" type="file" accept="image/*">
<div class="row"><div><label for="zoom">Zoom</label><input id="zoom" type="range" min="100" max="300" value="100"></div></div>
<div class="row"><div><label for="ox">Move left / right</label><input id="ox" type="range" min="-100" max="100" value="0"></div>
<div><label for="oy">Move up / down</label><input id="oy" type="range" min="-100" max="100" value="0"></div></div>
<button id="dl">Download flyer (PNG)</button>
<button id="reset" class="alt">Reset to original picture</button>
</section>
<section class="stage"><canvas id="c" width="1932" height="1932"></canvas>
<div class="hint">If the download button does nothing, right-click (or long-press) the flyer and choose Save image.</div></section>
</main>

var cv=document.getElementById("c"),ctx=cv.getContext("2d"),img=new Image(),$=function(i){return document.getElementById(i)};
img.onload=draw;img.src=DEFAULT_PHOTO;
function ordinal(n){var s=n%100;if(s>=11&&s<=13)return n+"th";return n+(["th","st","nd","rd"][n%10]||"th")}
function fmtDate(v){if(!v)return"";var p=v.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);
var days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],m=["January","February","March","April","May","June","July","August","September","October","November","December"];
return days[d.getDay()]+" "+ordinal(d.getDate())+" "+m[d.getMonth()]+" "+d.getFullYear()}
function fit(t,w,maxW,start,ls){var s=start;ctx.letterSpacing=ls||"0px";do{ctx.font=w+" "+s+"px Arial, Helvetica, sans-serif";if(ctx.measureText(t).width<=maxW)break;s-=2}while(s>24);return s}
function poly(pts,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function draw(){
ctx.textBaseline="alphabetic";ctx.letterSpacing="0px";
ctx.fillStyle="#00409c";ctx.fillRect(0,0,1932,1932);
// circles
ctx.fillStyle="#f5303f";ctx.beginPath();ctx.arc(45,1885,175,0,7);ctx.fill();
ctx.beginPath();ctx.arc(1840,1850,225,0,7);ctx.fill();
ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(1812,1812,64,58,0,0,7);ctx.fill();
// headline
ctx.fillStyle="#fff";ctx.font="900 150px Arial, Helvetica, sans-serif";ctx.letterSpacing="10px";ctx.fillText("JOIN ME",385,218);
// banner
poly([[363,246],[750,238],[650,373],[318,373]],"#f5303f");
poly([[750,240],[1618,230],[1536,373],[650,373]],"#efecfb");
ctx.fillStyle="#fff";ctx.font="300 120px Arial, Helvetica, sans-serif";ctx.letterSpacing="2px";ctx.fillText("LIVE",420,335);
var fm=("ON "+$("fm").value.trim()).toUpperCase(),fs=fit(fm,"300",740,118,"2px");
ctx.fillStyle="#f5173c";ctx.fillText(fm,768,335-(118-fs)*0.1);
// photo
var fx=630,fy=512,fw=732,fh=770;
ctx.save();ctx.beginPath();ctx.rect(fx,fy,fw,fh);ctx.clip();ctx.fillStyle="#dcdffc";ctx.fillRect(fx,fy,fw,fh);
if(img.complete&&img.naturalWidth){var z=$("zoom").value/100,sc=Math.max(fw/img.naturalWidth,fh/img.naturalHeight)*z,iw=img.naturalWidth*sc,ih=img.naturalHeight*sc;
var dx=fx+(fw-iw)/2+$("ox").value/100*(iw-fw)/2,dy=fy+(fh-ih)/2+$("oy").value/100*(ih-fh)/2;
if(iw<=fw)dx=fx+(fw-iw)/2;if(ih<=fh)dy=fy+(fh-ih)/2;ctx.drawImage(img,dx,dy,iw,ih)}
ctx.restore();
// name plate
ctx.fillStyle="#3e2a2e";ctx.fillRect(626,1282,741,221);
ctx.fillStyle="#fff";ctx.letterSpacing="0px";
var n=$("name").value.trim(),ns=fit(n,"400",705,74);ctx.fillText(n,648,1385);
var r=$("role").value.trim(),rs=fit(r,"400",705,44);ctx.fillText(r,648,1455);
// date pill
var g=ctx.createLinearGradient(0,1578,0,1692);g.addColorStop(0,"#4fd0e6");g.addColorStop(1,"#f5303f");
ctx.fillStyle=g;rr(276,1576,1366,118,59);ctx.fill();
ctx.fillStyle="#fff";rr(284,1584,1350,102,51);ctx.fill();
var d=fmtDate($("date").value),ds=fit(d,"700",1230,84,"4px");
ctx.fillStyle="#3e2a2e";ctx.textAlign="center";ctx.fillText(d,959,1664-(84-ds)*0.1);ctx.textAlign="left";ctx.letterSpacing="0px";
}
["name","role","fm","date","zoom","ox","oy"].forEach(function(i){$(i).addEventListener("input",draw)});
$("photo").addEventListener("change",function(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){img.src=rd.result;$("zoom").value=100;$("ox").value=0;$("oy").value=0};rd.readAsDataURL(f)});
$("reset").addEventListener("click",function(){img.src=DEFAULT_PHOTO;$("photo").value="";$("zoom").value=100;$("ox").value=0;$("oy").value=0});
$("dl").addEventListener("click",function(){cv.toBlob(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="flyer-"+($("name").value.trim().replace(/[^a-z0-9]+/gi,"-")||"guest")+".png";document.body.appendChild(a);a.click();a.remove()},"image/png")});
</script></body></html>
