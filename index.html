<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supporter Flyer Generator</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1b2233;--mute:#5b6478;--line:#d6dbe8;--brand:#033a8b;--red:#ff1c1c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#192032;--ink:#eef1f8;--mute:#9aa4bd;--line:#2c3650;--brand:#5b8def}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:22px 20px 6px;max-width:1100px;margin:auto}h1{margin:0;font-size:1.5rem}header p{margin:4px 0 0;color:var(--mute)}
main{max-width:1100px;margin:auto;padding:14px 20px 40px;display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px;align-items:start}
@media(max-width:800px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-weight:600;font-size:.85rem;margin:14px 0 6px}label:first-child{margin-top:0}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font-size:1rem}
input[type=file]{width:100%;font-size:.9rem;color:var(--mute)}input[type=range]{width:100%}
.row{display:flex;gap:10px}.row>div{flex:1}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--red);color:#fff;font-size:1rem;font-weight:700;cursor:pointer}
button.alt{background:transparent;color:var(--brand);border:1px solid var(--brand);margin-top:8px}
.stage{display:flex;flex-direction:column;align-items:center;gap:8px}
canvas{width:100%;max-width:560px;height:auto;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.hint{color:var(--mute);font-size:.8rem;text-align:center}
</style></head>
<body>
<header><h1> I endorse Kwame Asamoah</h1><p>Type your name and polling station, add your photo, then download.</p></header>
<main>
<section class="panel">
<label for="name">Your name</label><input id="name" type="text" value="Michael Boateng">
<label for="ps">Polling station / position</label><input id="ps" type="text" value="Polling Station Executive">
<label for="photo">Your picture</label><input id="photo" type="file" accept="image/*">
<div class="row"><div><label for="zoom">Zoom</label><input id="zoom" type="range" min="100" max="300" value="100"></div></div>
<div class="row"><div><label for="ox">Left / right</label><input id="ox" type="range" min="-100" max="100" value="0"></div>
<div><label for="oy">Up / down</label><input id="oy" type="range" min="-100" max="100" value="0"></div></div>
<label for="cand">Candidate name</label><input id="cand" type="text" value="Kwame Asamoah">
<button id="dl">Download flyer (PNG)</button>
<button id="reset" class="alt">Reset to original picture</button>
</section>
<section class="stage"><canvas id="c" width="1012" height="1280"></canvas>
<div class="hint">If the download button does nothing, right-click (or long-press) the flyer and choose Save image.</div></section>
</main>

["Bibiani","Anhwiaso","Bekwai NPP"].forEach(function(t,i){ctx.fillText(t,501,48+i*31.5)});
